services:
  - type: web
    name: mottainai-motta-hub
    runtime: python
    plan: free
    rootDir: motta-hub
    buildCommand: pip install -r requirements.txt && APP_ENV=test python -m unittest -v test_server && python render_build.py
    startCommand: APP_ENV=production python server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: BOOTSTRAP_USERS_JSON
        sync: false
