name: CI and Render deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motta-hub
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: motta-hub/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit and API tests
        run: python -m unittest -v test_server

      - name: Build documentation catalog
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          roles = {
              "arthur@mottainai.com": "DBA", "ana@mottainai.com": "DBA",
              "gustavo@mottainai.com": "DBA", "miguel@mottainai.com": "DBA",
              "rebecca@mottainai.com": "FULLSTACK", "kevin@mottainai.com": "FULLSTACK",
              "joao.vitor@mottainai.com": "FULLSTACK", "pedro@mottainai.com": "FULLSTACK",
              "joao@mottainai.com": "USER", "isabella@mottainai.com": "USER",
              "luana@mottainai.com": "USER", "giovanna@mottainai.com": "USER",
          }
          fake_hash = "$2b$12$" + "A" * 53
          os.environ["BOOTSTRAP_USERS_JSON"] = json.dumps([
              {"email": email, "role": role, "passwordHash": fake_hash}
              for email, role in roles.items()
          ])
          subprocess.run(["python", "render_build.py"], check=True)
          PY

      - name: Start containerized Hub and PostgreSQL
        run: docker compose up --build --detach --wait

      - name: Verify container health and API
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8766/healthz
          python - <<'PY'
          import http.cookiejar
          import json
          import urllib.request

          base_url = "http://127.0.0.1:8766"
          cookies = http.cookiejar.CookieJar()
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cookies))
          login = urllib.request.Request(
              f"{base_url}/api/login",
              data=json.dumps({
                  "email": "databaseadmin@mottainai.com",
                  "password": "senha@DBA1",
              }).encode(),
              headers={"Content-Type": "application/json", "Origin": base_url},
              method="POST",
          )
          with client.open(login) as response:
              assert response.status == 200
          with client.open(f"{base_url}/api/documentations") as response:
              catalog = json.load(response)
          assert catalog["schemas"] and catalog["documents"]
          print("Authenticated documentation API smoke test passed.")
          PY

      - name: Stop containerized services
        if: always()
        run: docker compose down --volumes
